[project]
name = "lexiguide"
version = "1.0.0"
description = "Grounded, voice-enabled legal document assistant powered by Gemini."
readme = "README.md"
requires-python = ">=3.11"
# Keep in sync with requirements.txt (Vercel installs from here).
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "google-genai==2.24.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.32",
  "numpy==2.4.6",
  "pypdf==6.19.0",
  "python-docx==1.2.0",
  "openpyxl==3.1.5",
  "python-pptx==1.0.2",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "C4", "PT", "RET", "ASYNC"]
ignore = [
  "S101",   # assert is fine for type narrowing and in tests
  "RUF001", # allow typographic characters in user-facing strings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "RUF012"]
"app/prompts.py" = ["E501"]  # prompt text reads better unwrapped

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/", ".venv/"]
